server {
    listen 22777 ssl;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    gzip on;
    gzip_types application/wasm application/javascript text/html application/octet-stream;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # WebSocket game traffic → Godot server on the host machine
    location /ws {
        proxy_pass http://127.0.0.1:22778;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Web export files
    location / {
        root /usr/share/nginx/html;
        add_header Cross-Origin-Opener-Policy  "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Cache large immutable assets aggressively
    location ~* \.(wasm|pck)$ {
        root /usr/share/nginx/html;
        add_header Cross-Origin-Opener-Policy  "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "public, max-age=3600, immutable";
    }
}
