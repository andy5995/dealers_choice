[game]

; Seconds a player has to act before auto-folding (or auto-checking if no bet is owed).
turn_timeout_sec=30.0

; Seconds a player has to choose discards before standing pat automatically.
draw_timeout_sec=30.0

; Direction the dealer button moves after each hand.
; 1 = forward through player order (default), -1 = backward.
dealer_rotation=1

; Chips each player starts with.
starting_chips=20000

; Ante collected from every player at the start of a hand.
ante=50

; Minimum bet/raise increment (the smallest bet-amount button is this or higher).
min_bet=100

; Seconds the final "X wins the game!" screen shows before auto-returning to the lobby.
end_of_game_timeout=15.0
